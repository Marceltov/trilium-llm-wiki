site_name: trilium-llm-wiki
site_description: "An LLM-maintained wiki in Trilium Notes, built and kept up by Claude: a Claude Code plugin on top of the Trilium Notes MCP server."
site_url: https://trilium-llm-wiki.marceltov.de/
repo_url: https://github.com/Marceltov/trilium-llm-wiki
repo_name: Marceltov/trilium-llm-wiki
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://github.com/Marceltov/trilium-llm-wiki/blob/main/LICENSE">MIT</a>

# Planning notes are local-only.
exclude_docs: |
  superpowers/
  adr/

nav:
  - Home: index.md
  - Install and connect: install.md
  - Set up the wiki: setup.md
  - Workflows: workflows.md
  - Graph and review: graph-and-review.md
  - Write lock: write-lock.md
  - Customise your schema: customise.md
  - Recall: recall.md

theme:
  name: material
  logo: trilium.svg
  favicon: trilium.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
