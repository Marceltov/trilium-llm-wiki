name: Checks

# The shared rules copies in skills/*/reference/ must match shared/rules.md,
# the SessionStart hook's self-test must pass, and setup.py must build the
# structure once and then change nothing (tests/test_setup.py).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync-shared.sh --check
      - run: bash scripts/test-check-trilium-credentials.sh
      - run: python3 -I tests/test_setup.py

  recall-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recall-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q app/tests --ignore=app/tests/live
